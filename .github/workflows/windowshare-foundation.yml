name: Window sharing foundation
on:
  push:
    paths:
      - 'src/lib/windowshare/**'
      - 'src/apps/windowshare/**'
      - 'src/unittests/windowshare/**'
      - '.github/workflows/windowshare-foundation.yml'
  pull_request:
    paths:
      - 'src/lib/windowshare/**'
      - 'src/apps/windowshare/**'
      - 'src/unittests/windowshare/**'
      - '.github/workflows/windowshare-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure core with sanitizers
        run: >-
          cmake -S src/unittests/windowshare -B build/core
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DWINDOWSHARE_SANITIZERS=ON
      - run: cmake --build build/core --parallel 2
      - run: ctest --test-dir build/core --output-on-failure
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and test-certificate dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev openssl
      - run: cmake -S src/apps/windowshare -B build/transport
      - run: cmake --build build/transport --parallel 2
      - run: ctest --test-dir build/transport --output-on-failure
