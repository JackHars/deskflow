name: Window sharing checks
on:
  push:
    paths:
      - 'src/lib/windowshare/**'
      - 'src/apps/windowshare/**'
      - 'src/apps/deskflow-core/**'
      - 'deploy/windowshare/**'
      - 'src/unittests/windowshare/**'
      - '.github/workflows/windowshare-foundation.yml'
      - 'src/lib/platform/OSXComputer.mm'
      - 'src/lib/platform/OSXComputer.h'
      - 'src/lib/platform/OSXKeyState.*'
      - 'src/unittests/platform/OSXKeyStateTests.*'
      - 'src/unittests/platform/EiComputer*'
      - 'src/unittests/platform/CMakeLists.txt'
      - 'src/lib/platform/OSXEventTapRunLoop.h'
      - 'src/lib/platform/XWindowsComputer.*'
      - 'src/lib/platform/EiComputer.*'
      - 'src/lib/base/Event*'
      - 'src/lib/base/IEventQueue*'
      - 'src/lib/base/SimpleEventQueueBuffer.*'
      - 'src/lib/base/CMakeLists.txt'
      - 'src/lib/platform/*EventQueueBuffer.*'
      - 'src/unittests/base/EventQueueTests.*'
      - 'src/unittests/base/CMakeLists.txt'
      - 'src/lib/platform/OriginalKeyboard_mac.*'
      - 'src/lib/platform/OriginalInput*_mac.*'
      - 'src/lib/platform/CMakeLists.txt'
      - 'src/lib/io/**'
      - 'src/lib/net/**'
      - 'src/unittests/net/**'
      - 'src/lib/server/**'
      - 'src/lib/client/**'
      - 'src/lib/deskflow/InputSequence.h'
      - 'src/lib/deskflow/InputCutoffProtocol.h'
      - 'src/lib/deskflow/InputPreparationProtocol.h'
      - 'src/lib/deskflow/Computer.*'
      - 'src/lib/deskflow/IPlatformComputer.h'
      - 'src/lib/deskflow/OptionTypes.h'
      - 'src/lib/deskflow/ProtocolTypes.*'
      - 'src/lib/deskflow/ServerApp.*'
      - 'src/lib/deskflow/ClientApp.*'
      - 'src/lib/deskflow/CMakeLists.txt'
      - 'src/unittests/server/**'
      - 'src/unittests/client/**'
      - 'src/unittests/deskflow/**'
      - 'src/apps/CMakeLists.txt'
      - 'src/unittests/CMakeLists.txt'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - 'src/lib/windowshare/**'
      - 'src/apps/windowshare/**'
      - 'src/apps/deskflow-core/**'
      - 'deploy/windowshare/**'
      - 'src/unittests/windowshare/**'
      - '.github/workflows/windowshare-foundation.yml'
      - 'src/lib/platform/OSXComputer.mm'
      - 'src/lib/platform/OSXComputer.h'
      - 'src/lib/platform/OSXKeyState.*'
      - 'src/unittests/platform/OSXKeyStateTests.*'
      - 'src/unittests/platform/EiComputer*'
      - 'src/unittests/platform/CMakeLists.txt'
      - 'src/lib/platform/OSXEventTapRunLoop.h'
      - 'src/lib/platform/XWindowsComputer.*'
      - 'src/lib/platform/EiComputer.*'
      - 'src/lib/base/Event*'
      - 'src/lib/base/IEventQueue*'
      - 'src/lib/base/SimpleEventQueueBuffer.*'
      - 'src/lib/base/CMakeLists.txt'
      - 'src/lib/platform/*EventQueueBuffer.*'
      - 'src/unittests/base/EventQueueTests.*'
      - 'src/unittests/base/CMakeLists.txt'
      - 'src/lib/platform/OriginalKeyboard_mac.*'
      - 'src/lib/platform/OriginalInput*_mac.*'
      - 'src/lib/platform/CMakeLists.txt'
      - 'src/lib/io/**'
      - 'src/lib/net/**'
      - 'src/unittests/net/**'
      - 'src/lib/server/**'
      - 'src/lib/client/**'
      - 'src/lib/deskflow/InputSequence.h'
      - 'src/lib/deskflow/InputCutoffProtocol.h'
      - 'src/lib/deskflow/InputPreparationProtocol.h'
      - 'src/lib/deskflow/Computer.*'
      - 'src/lib/deskflow/IPlatformComputer.h'
      - 'src/lib/deskflow/OptionTypes.h'
      - 'src/lib/deskflow/ProtocolTypes.*'
      - 'src/lib/deskflow/ServerApp.*'
      - 'src/lib/deskflow/ClientApp.*'
      - 'src/lib/deskflow/CMakeLists.txt'
      - 'src/unittests/server/**'
      - 'src/unittests/client/**'
      - 'src/unittests/deskflow/**'
      - 'src/apps/CMakeLists.txt'
      - 'src/unittests/CMakeLists.txt'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windowshare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Configure core with sanitizers
        run: >-
          cmake -S src/unittests/windowshare -B build/core
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DWINDOWSHARE_SANITIZERS=ON
      - run: cmake --build build/core --parallel 2
      - run: ctest --test-dir build/core --output-on-failure
      - name: Verify platform-independent library policy parsers
        run: python3 deploy/windowshare/macos-bundle-tests.py ExactPolicyTests SigningFactsTests
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and test-certificate dependencies
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev openssl
      - run: cmake -S src/apps/windowshare -B build/transport
      - run: cmake --build build/transport --parallel 2
      - run: ctest --test-dir build/transport --output-on-failure
      - name: Check private framing, pairing and code admission with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S src/apps/windowshare -B build/private-sanitize -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/private-sanitize --target windowshare-preflight-tests windowshare-local-input-tests windowshare-bootstrap-tests windowshare-code-admission-tests windowshare-input-evidence-tests --parallel 2
          ctest --test-dir build/private-sanitize -R '^windowshare-(preflight|local-input|bootstrap|code-admission|input-evidence)$' --output-on-failure
  linux-app:
    runs-on: ubuntu-24.04
    container:
      # libei >= 1.5 fixes teardown before EIS handshake completion. Keep the
      # real startup/shutdown regression enabled on the supported runtime.
      image: ubuntu:26.04
      options: --init
    timeout-minutes: 35
    steps:
      - name: Install viewer, X11 fixture and core dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake build-essential ninja-build pkg-config python3 \
            qt6-base-dev qt6-tools-dev libavcodec-dev libavutil-dev libswscale-dev libx264-dev openssl libssl-dev help2man \
            libx11-dev libx11-xcb-dev libxtst-dev libxkbfile-dev libxinerama-dev libxrandr-dev libxi-dev \
            libxcb-randr0-dev libxcb-xinput-dev libxcb-cursor0 xvfb xauth dbus-daemon dbus-bin \
            libxkbregistry-dev libxkbcommon-dev libei-dev libeis-dev libportal-dev
      - uses: actions/checkout@v4
      - name: Configure the opt-in application
        run: cmake -S src/apps/windowshare -B build/app -DWINDOWSHARE_APP=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/app --parallel 2
      - run: ctest --test-dir build/app --output-on-failure
      - name: Check Linux platform diagnostics
        run: QT_QPA_PLATFORM=offscreen build/app/deskflow-windowshare --probe
      - name: Check viewer reconnect against a disposable TLS fixture
        run: python3 deploy/windowshare/viewer-smoke.py build/app/deskflow-windowshare
      - name: Check cross-machine control and bounded relay shutdown
        run: python3 deploy/windowshare/gnome-crossmachine-tests.py
      - name: Verify passive resource-soak evidence sampler
        run: |
          python3 deploy/windowshare/resource-soak-tests.py
          python3 deploy/windowshare/resource-budget-tests.py
      - name: Verify bounded input and latency evidence analysis
        run: |
          python3 deploy/windowshare/h11-evidence-tests.py
          python3 deploy/windowshare/input-evidence-normalize-tests.py
      - name: Check user-started physical acceptance controls without input
        run: |
          python3 deploy/windowshare/physical-linux-tests.py
          python3 deploy/windowshare/physical-desktop-tests.py
          python3 deploy/windowshare/physical-macos-tests.py
          python3 deploy/windowshare/physical-preview-tests.py
      - name: Compile the real opt-in Linux injection backend
        run: |
          cmake -S . -B build/integrated -DBUILD_WINDOWSHARE=ON -DBUILD_INSTALLER=OFF -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON
          cmake --build build/integrated --target deskflow-core EventQueueTests windowshare-core-args-tests windowshare-x11-viewport-tests EiComputerTests OriginalInputCoordinatorTests InputSequenceTests ComputerInputSequenceTests ClientProxyTests ServerProxyTests ServerTests --parallel 2
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/integrated/src/unittests -R '^(EventQueueTests|EiComputerTests|OriginalInputCoordinatorTests|InputSequenceTests|ComputerInputSequenceTests|ClientProxyTests|ServerProxyTests|ServerTests|windowshare-(core-args|x11-viewport-.*))$' --output-on-failure
      - name: Verify terminal GNOME provider absence on a private bus
        run: python3 deploy/windowshare/gnome-core-smoke.py build/integrated/bin/deskflow-core
      - name: Exercise the real core observer on a private Xvfb
        run: python3 deploy/windowshare/x11-core-smoke.py build/integrated/bin/deskflow-core
      - name: Check ordinary protocol compatibility with window sharing disabled
        run: |
          cmake -S . -B build/legacy -DBUILD_WINDOWSHARE=OFF -DBUILD_INSTALLER=OFF -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON
          cmake --build build/legacy --target deskflow-core EventQueueTests EiComputerTests ServerTests ClientProxyTests ServerProxyTests --parallel 2
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/legacy/src/unittests -R '^(EventQueueTests|EiComputerTests|ServerTests|ClientProxyTests|ServerProxyTests)$' --output-on-failure
      - name: Verify generic event observation lifetime with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S . -B build/events-sanitize -DBUILD_WINDOWSHARE=OFF -DBUILD_INSTALLER=OFF -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/events-sanitize --target EventQueueTests --parallel 2
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/events-sanitize/src/unittests -R '^EventQueueTests$' --no-tests=error --output-on-failure
      - name: Package and verify inert experimental Linux binaries
        run: |
          python3 deploy/windowshare/package-linux-tests.py
          python3 deploy/windowshare/package-linux.py \
            --viewer build/app/deskflow-windowshare \
            --core build/integrated/bin/deskflow-core \
            --source-sha "${{ github.sha }}" \
            --output build/DeskflowSeamless-Linux-Experimental.tar.gz
          python3 deploy/windowshare/package-linux.py \
            --verify build/DeskflowSeamless-Linux-Experimental.tar.gz
          mkdir -p build/verify-stage
          tar -xzf build/DeskflowSeamless-Linux-Experimental.tar.gz -C build/verify-stage
          QT_QPA_PLATFORM=offscreen build/verify-stage/deskflow-seamless-linux-experimental/bin/deskflow-seamless-viewer --help
          QT_QPA_PLATFORM=offscreen build/verify-stage/deskflow-seamless-linux-experimental/bin/deskflow-seamless-core --help
      - name: Record verified Linux package provenance
        run: |
          mkdir -p build/ci-artifacts
          cp build/DeskflowSeamless-Linux-Experimental.tar.gz build/ci-artifacts/
          # The container can read a checkout owned by the runner's UID.
          # Scope trust to this one read instead of changing global Git policy.
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD > build/ci-artifacts/SOURCE_COMMIT
          test "$(cat build/ci-artifacts/SOURCE_COMMIT)" = "$GITHUB_SHA"
          cd build/ci-artifacts
          sha256sum DeskflowSeamless-Linux-Experimental.tar.gz SOURCE_COMMIT > SHA256SUMS
      - name: Retain verified experimental Linux package
        uses: actions/upload-artifact@v4
        with:
          name: windowshare-linux-${{ github.sha }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: build/ci-artifacts/
  gnome-provider:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
      options: --init
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exercise native GNOME ownership and the actual QtWayland painted viewer
        # Private buses/runtime/settings and software Mesa; no host display,
        # input devices, GPU, privileged mode, or production authority grants.
        run: bash deploy/windowshare/gnome-provider-container.sh "$PWD" "$PWD/build/gnome-provider"
      - name: Retain actual compositor and EIS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-provider-headless
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/gnome-provider/*.log
            build/gnome-provider/*.json
            build/gnome-provider/*.jsonl
            build/gnome-provider/**/*.log
            build/gnome-provider/**/*.json
            build/gnome-provider/**/*.jsonl
  mac-app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check manual coordinator cancellation and receipt freshness without input
        run: |
          python3 deploy/windowshare/physical-macos-tests.py
          python3 deploy/windowshare/physical-desktop-tests.py
          python3 deploy/windowshare/physical-preview-tests.py
      - name: Verify passive resource-soak evidence sampler
        run: |
          python3 deploy/windowshare/resource-soak-tests.py
          python3 deploy/windowshare/resource-budget-tests.py
      - name: Verify bounded input and latency evidence analysis
        run: |
          python3 deploy/windowshare/h11-evidence-tests.py
          python3 deploy/windowshare/input-evidence-normalize-tests.py
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Install decoder dependencies
        run: brew install ffmpeg pkgconf
      - name: Configure the opt-in application
        # Match the compatible SDK used by the repository's Intel Mac CI.
        run: cmake -S src/apps/windowshare -B build/app -DWINDOWSHARE_APP=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_SYSROOT=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
      - run: cmake --build build/app --parallel 3
      - run: ctest --test-dir build/app --output-on-failure
      - name: Configure opt-in Deskflow integration
        run: cmake -S . -B build/integrated -DBUILD_WINDOWSHARE=ON -DBUILD_INSTALLER=OFF -DBUILD_OSX_BUNDLE=OFF -DSKIP_BUILD_TESTS=ON -DCMAKE_OSX_SYSROOT=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
      - run: cmake --build build/integrated --target deskflow-core EventQueueTests windowshare-core-args-tests OriginalInputCoordinatorTests ServerTests ClientProxyTests ServerProxyTests InputSequenceTests ComputerInputSequenceTests SecurePeerIdentityTests OSXKeyStateTests --parallel 3
      - run: QT_QPA_PLATFORM=offscreen ctest --test-dir build/integrated/src/unittests -R '^(EventQueueTests|OriginalInputCoordinatorTests|ServerTests|ClientProxyTests|ServerProxyTests|InputSequenceTests|ComputerInputSequenceTests|SecurePeerIdentityTests|windowshare-core-args)$' --output-on-failure
      - name: Verify Mac hotkey modifier mapping without posting input
        env:
          QT_QPA_PLATFORM: offscreen
        run: build/integrated/src/unittests/platform/OSXKeyStateTests mapModifiersFromOSX_OSXMask mapHotkeyModifiersToMac
      - name: Check ordinary Core compatibility with window sharing disabled
        run: |
          cmake -S . -B build/legacy -DBUILD_WINDOWSHARE=OFF -DBUILD_INSTALLER=OFF -DBUILD_OSX_BUNDLE=OFF -DBUILD_TESTS=ON -DSKIP_BUILD_TESTS=ON -DCMAKE_OSX_SYSROOT=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
          cmake --build build/legacy --target deskflow-core EventQueueTests ServerTests ClientProxyTests ServerProxyTests --parallel 3
          QT_QPA_PLATFORM=offscreen ctest --test-dir build/legacy/src/unittests -R '^(EventQueueTests|ServerTests|ClientProxyTests|ServerProxyTests)$' --output-on-failure
      - name: Verify mixed input state, capture lifecycle and private CGEvent construction
        run: |
          cmake -S src/unittests/windowshare -B build/keyboard -DWINDOWSHARE_SANITIZERS=ON
          cmake --build build/keyboard --parallel 3
          ctest --test-dir build/keyboard --output-on-failure
      - name: Test recursive Mac dependency packaging
        run: python3 deploy/windowshare/macos-bundle-tests.py
      - name: Package and verify a standalone experimental Mac app
        run: |
          deploy/windowshare/package-macos.sh build/app build/package
          QT_QPA_PLATFORM=offscreen build/package/DeskflowWindowShare-Experimental.app/Contents/MacOS/deskflow-windowshare --help
          python3 deploy/windowshare/viewer-smoke.py build/package/DeskflowWindowShare-Experimental.app/Contents/MacOS/deskflow-windowshare
      - name: Verify the packaged private core and host handshake without input hooks
        run: |
          deploy/windowshare/package-macos.sh build/app build/core-package - build/integrated/bin/deskflow-core
          python3 deploy/windowshare/launch-smoke.py build/core-package/DeskflowSeamless-Core-Experimental.app --reject-code-admission
      - name: Record verified Mac package provenance
        run: |
          mkdir -p build/ci-artifacts
          cp build/package/DeskflowWindowShare-Experimental.zip build/ci-artifacts/
          cp build/core-package/DeskflowSeamless-Core-Experimental.zip build/ci-artifacts/
          git rev-parse HEAD > build/ci-artifacts/SOURCE_COMMIT
          test "$(cat build/ci-artifacts/SOURCE_COMMIT)" = "$GITHUB_SHA"
          cd build/ci-artifacts
          shasum -a 256 DeskflowWindowShare-Experimental.zip DeskflowSeamless-Core-Experimental.zip SOURCE_COMMIT > SHA256SUMS
      - name: Retain verified experimental Mac packages
        uses: actions/upload-artifact@v4
        with:
          # CI uses ad-hoc signing; these do not carry the local Apple-issued
          # identity or its exact-library admission policy.
          name: windowshare-macos-adhoc-${{ github.sha }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: build/ci-artifacts/
      # Native capture/input needs an unlocked desktop and explicit TCC grants.
      # This job builds the smoke tools but never reports them as hardware tests.
